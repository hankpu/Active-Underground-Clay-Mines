<!DOCTYPE html>
<html lang='eng'>
<head>
    <title>Active Underground Clay Mines Heatmap</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* Title box styling */
        #title-box {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            z-index: 1;
        }
    </style>
</head>

<body>
    <!-- Title Box -->
    <div id="title-box">Active Underground Clay Mines Heatmap</div>

    <!-- Map Container -->
    <div id="map"></div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiaGFua3AiLCJhIjoiY203dzRmdWt5MDFwMjJtcHV4eDZjeG5ydyJ9.EnPsvtd6-CdbfBX1vJ3FVA';  

        var map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/hankp/cma5lvdqs006101si5si4b720',
            center: [-105.80953414479661, 38.877544885573144],
            zoom: 7
        });

        map.on('load', function () {
            map.addLayer({
                id: 'clay_mine_point',
                type: 'heatmap',
                source: {
                    type: 'vector',
                    url: 'mapbox://hankp.9l4km4hj'
                },
                'source-layer': 'spatial_clay_mine-8kiepp',
                layout: {
                    visibility: 'visible'
                },
                paint: {
                    'heatmap-weight': 10,
                    'heatmap-radius': 20,
                    'heatmap-intensity': 1
                }
            });

            // Use correct field name – remove 'properties.' unless it's part of the actual name
            map.setFilter('clay_mine_point', ['==', ['get', 'properties.deposits.dev_st'], 'Producer']);
        });
    </script>
</body>
</html>
